apiVersion: ai.sap.com/v1alpha1 kind: ExecutableTemplate metadata:name: blob-delete-partsannotations:scenarios.ai.sap.com/name: "Code (Tutorial)"scenarios.ai.sap.com/description: "Delete only part-*.csv files (parallel)"executables.ai.sap.com/name: "delete-parts"executables.ai.sap.com/description: "Delete parts"labels:ai.sap.com/version: "5.0" spec:inputs:parameters:- name: prefixtype: string- name: workerstype: integerdefault: 256- name: AZURE_ACCOUNT_URLtype: string- name: AZURE_SAS_TOKENtype: string- name: AZURE_CONTAINERtype: stringtemplate: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      labels:
        ai.sap.com/resourcePlan: starter
    spec:
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: credstutorialrepo
          containers:
            - name: worker
              image: docker.io/chetankommula/blob-tools:latest
              imagePullPolicy: Always
              command:
                - python
                - app.py
                - delete-parts
                - --prefix
                - "{{inputs.parameters.prefix}}"
                - --workers
                - "{{inputs.parameters.workers}}"
              env:
                - name: AZURE_ACCOUNT_URL
                  value: "{{inputs.parameters.AZURE_ACCOUNT_URL}}"
                - name: AZURE_SAS_TOKEN
                  value: "{{inputs.parameters.AZURE_SAS_TOKEN}}"
                - name: AZURE_CONTAINER
                  value: "{{inputs.parameters.AZURE_CONTAINER}}"
